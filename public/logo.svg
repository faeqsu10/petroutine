<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E5F" />
      <stop offset="100%" stop-color="#FEB47B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#FF7E5F" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="400" height="400" x="56" y="56" rx="90" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- Paw Print Main Pad -->
  <path d="M256 360 c-45 0-75-30-75-65 c0-25 25-45 45-55 c15-7.5 45-7.5 60 0 c20 10 45 30 45 55 c0 35-30 65-75 65 z" fill="#FFFFFF" />
  
  <!-- Paw Toes -->
  <circle cx="160" cy="220" r="28" fill="#FFFFFF" />
  <circle cx="205" cy="155" r="32" fill="#FFFFFF" />
  <circle cx="307" cy="155" r="32" fill="#FFFFFF" />
  <circle cx="352" cy="220" r="28" fill="#FFFFFF" />
  
  <!-- Checkmark Badge (Routine / Completion) -->
  <circle cx="350" cy="330" r="48" fill="#FF7E5F" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M328 330 l15 15 l30 -30" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
